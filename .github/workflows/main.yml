name: RDP

on:
  workflow_dispatch:
    inputs:
      rdp_username:
        description: 'RDP Username'
        required: true
        default: 'RDP'
      rdp_password:
        description: 'RDP password (leave blank to auto-generate a random password). If entering manually: minimum 8 characters, including uppercase letters, lowercase letters, numbers, and special characters.'
        required: false
        default: ''

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        env:
          RDP_USERNAME: ${{ inputs.rdp_username }}
          RDP_PASSWORD_INPUT: ${{ inputs.rdp_password }}
        run: |
          $username = $env:RDP_USERNAME

          function Test-PasswordComplexity {
              param([string]$pwd)
              if ($pwd.Length -lt 8) { return $false }
              $categories = 0
              if ($pwd -cmatch '[A-Z]') { $categories++ }
              if ($pwd -cmatch '[a-z]') { $categories++ }
              if ($pwd -match '[0-9]') { $categories++ }
              if ($pwd -match '[^a-zA-Z0-9]') { $categories++ }
              return ($categories -ge 3)
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD_INPUT)) {
              $charSet = @{
                  Upper   = [char[]](65..90)
                  Lower   = [char[]](97..122)
                  Number  = [char[]](48..57)
                  Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
              }
              $rawPassword = @()
              $rawPassword += $charSet.Upper | Get-Random -Count 4
              $rawPassword += $charSet.Lower | Get-Random -Count 4
              $rawPassword += $charSet.Number | Get-Random -Count 4
              $rawPassword += $charSet.Special | Get-Random -Count 4
              $password = -join ($rawPassword | Sort-Object { Get-Random })
          } else {
              if (-not (Test-PasswordComplexity $env:RDP_PASSWORD_INPUT)) {
                  Write-Error "Mat khau ban nhap khong dat yeu cau: toi thieu 8 ky tu, va phai co du 3 trong 4 loai (chu hoa, chu thuong, so, ky tu dac biet). Vui long chay lai va nhap mat khau khac, hoac de trong de tu tao mat khau."
                  exit 1
              }
              $password = $env:RDP_PASSWORD_INPUT
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $username -Password $securePass
          } else {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          }

          echo "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name $username)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $proc = Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart", "/log", "$env:TEMP\ts_install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
              Write-Error "MSI install failed with exit code $($proc.ExitCode)"
              Get-Content "$env:TEMP\ts_install.log" -Tail 50
              exit 1
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
              Write-Error "tailscale.exe not found after install at $tsExe"
              exit 1
          }

          Remove-Item $installerPath -Force
          Write-Host "Tailscale installed successfully at $tsExe"

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
